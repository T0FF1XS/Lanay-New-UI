<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#b3262c" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="lanay.css" />
    <title>Lanay Restaurant</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="js/logo.js"></script>
    <script>
      document.getElementById('app').innerHTML = `
        <div class="login">
          <img class="brand" src="${LOGO}" alt="Lanay Restaurant" />
          <p class="mut">Staff only. Open your own station.</p>
          <div class="grid">
            <a class="card hov" data-role="waiter" href="waiter.html">
              <div class="dish">
                <svg class="i"><use href="icons.svg#i-concierge-bell" /></svg>
              </div>
              <b style="display: block; margin-top: 8px">Waiter</b>
              <span class="mut">Tables and orders</span>
            </a>
            <a class="card hov" data-role="kitchen" href="kitchen.html">
              <div class="dish">
                <svg class="i"><use href="icons.svg#i-flame" /></svg>
              </div>
              <b style="display: block; margin-top: 8px">Kitchen</b>
              <span class="mut">Tickets and timers</span>
            </a>
            <a class="card hov" data-role="cashier" href="cashier.html">
              <div class="dish">
                <svg class="i"><use href="icons.svg#i-wallet" /></svg>
              </div>
              <b style="display: block; margin-top: 8px">Cashier</b>
              <span class="mut">Bills and payments</span>
            </a>
            <a class="card hov" data-role="owner" href="owner.html">
              <div class="dish">
                <svg class="i"><use href="icons.svg#i-store" /></svg>
              </div>
              <b style="display: block; margin-top: 8px">Owner</b>
              <span class="mut">Menu, stock and reports</span>
            </a>
          </div>
        </div>
      `;
    </script>
  </body>
</html>
